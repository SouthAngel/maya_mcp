[package]
name = "maya_mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server that evaluates MEL/Python scripts inside a running Maya instance"

[dependencies]
rmcp = { version = "3.4.1", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
strip = true
lto = true
